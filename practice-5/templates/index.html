<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генетичний алгоритм</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        
        .description {
            background: rgba(52, 73, 94, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            border-left: 5px solid #667eea;
        }
        
        .description p {
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .description a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .description a:hover {
            color: #764ba2;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Генетичний алгоритм</h1>
    
        <form method="POST" action="/run">
            <div class="grid">
                <div class="form-group">
                    <label for="pop_size">🔢 Розмір популяції:</label>
                    <input type="number" id="pop_size" name="pop_size" value="50" min="10" max="1000" required>
                </div>
                
                <div class="form-group">
                    <label for="num_generations">⏳ Кількість поколінь:</label>
                    <input type="number" id="num_generations" name="num_generations" value="100" min="10" max="1000" required>
                </div>
                
                <div class="form-group">
                    <label for="crossover_prob">🔄 Ймовірність схрещування:</label>
                    <input type="number" id="crossover_prob" name="crossover_prob" value="0.8" min="0.0" max="1.0" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="mutation_prob">🎲 Ймовірність мутації:</label>
                    <input type="number" id="mutation_prob" name="mutation_prob" value="0.1" min="0.0" max="1.0" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="tournament_size">🏆 Розмір турніру:</label>
                    <input type="number" id="tournament_size" name="tournament_size" value="3" min="2" max="10" required>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">🚀 Запустити алгоритм</button>
        </form>
        
        <div class="description">
            <p><strong>📊 Опис задачі:</strong> Максимізація функції f(x) = x * sin(x) в діапазоні [0, 10]</p>
            <p><a href="/results">📈 Переглянути результати останнього запуску</a></p>
            <p><a href="/docs">📚 API документація</a></p>
        </div>
    </div>
</body>
</html>
